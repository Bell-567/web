<!DOCTYPE html>

  <script>
    // 主题初始化：必须在样式生效前执行，避免暗色模式刷新时闪烁
    (function () {
      var saved = localStorage.getItem('theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
    })();
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pages.css">

          </svg>
        </button>

        <button class="nav-toggle" id="navToggle" type="button" aria-label="打开导航菜单" aria-expanded="false" aria-controls="navMenu">
          <span></span>
          <span></span>
          <span></span>

            热爱用代码把想法变成看得见的界面，专注于 HTML / CSS / JavaScript 的工程实践，

          </p>
          <p class="hero-typing">
            我擅长 <span class="typed" id="typed"></span><span class="cursor" aria-hidden="true">|</span>
          </p>
          <div class="hero-buttons">
            <a href="projects.html" class="btn">查看我的项目</a>
            <a href="contact.html" class="btn btn-outline">联系我</a>
          </div>
        </div>

        <div class="hero-avatar" aria-hidden="true">
          <!-- 使用 CSS 渐变 + 内联 SVG 占位，不依赖外部图片 -->
          <svg viewBox="0 0 200 200" width="240" height="240" role="img" aria-label="头像占位">
            <defs>
              <linearGradient id="avatarGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#6366f1"></stop>
                <stop offset="100%" stop-color="#06b6d4"></stop>
              </linearGradient>
            </defs>
            <circle cx="100" cy="100" r="96" fill="url(#avatarGrad)"></circle>
            <circle cx="100" cy="78" r="32" fill="#ffffff" opacity="0.92"></circle>
            <path d="M40 172c0-34 27-56 60-56s60 22 60 56z" fill="#ffffff" opacity="0.92"></path>
          </svg>
        </div>
      </div>
    </section>

    <!-- ========== 技能卡片区 ========== -->
    <section class="section">
      <div class="container">
        <h2 class="section-title">我的技能</h2>

          </div>
          <div class="stat-item">
            <strong>0</strong>

          </div>
        </div>
      </div>
    </section>
